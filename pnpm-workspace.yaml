packages:
  - "apps/*"
  - "packages/*"
  - "packages/config/*"

# Dependencies whose postinstall build scripts pnpm is allowed to run.
# esbuild is required by tsx / tsup.
allowBuilds:
  esbuild: true
  unrs-resolver: set this to true or false

# Tolerate a slow connection to the registry: long tarball timeout, more
# retries, fewer parallel downloads.
fetchTimeout: 600000
fetchRetries: 6
networkConcurrency: 4

minimumReleaseAgeExclude:
  - zod@4.6.1
  - '@turbo/darwin-64@2.10.13'
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/linux-arm64@2.10.13'
  - '@turbo/windows-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - turbo@2.10.13
