packages:
  - "apps/*"
  - "packages/*"
  - "packages/config/*"

# Dependencies whose postinstall build scripts pnpm is allowed to run.
# pnpm blocks install scripts by default and fails the install until each one
# is answered here with true (run it) or false (skip it).
# esbuild is required by tsx / tsup.
# unrs-resolver is the native module resolver behind ESLint's import plugin; its
# script only fetches the prebuilt binary for this platform.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Tolerate a slow connection to the registry: long tarball timeout, more
# retries, fewer parallel downloads.
fetchTimeout: 600000
fetchRetries: 6
networkConcurrency: 4

minimumReleaseAgeExclude:
  - zod@4.6.1
  - '@turbo/darwin-64@2.10.13'
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/linux-arm64@2.10.13'
  - '@turbo/windows-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - turbo@2.10.13
